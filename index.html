<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オシロスコープ</title>
<style>
  :root{--bg:#0e1113;--panel:#171b1e;--line:#2a3035;--text:#d8dee3;--muted:#8a949c;--c1:#7CFF8A;--c2:#FFD166;--acc:#4fc3f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Hiragino Sans",sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:12px}
  h1{font-size:16px;margin:4px 0 10px;font-weight:600;letter-spacing:.02em}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;font-size:14px}
  .tabs button.on{color:var(--text);border-color:var(--acc);background:#1c2429}
  .screen{position:relative;background:#050807;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  canvas{display:block;width:100%;aspect-ratio:10/8}
  .readout{position:absolute;left:8px;top:6px;font:12px ui-monospace,Menlo,monospace;color:var(--c1);pointer-events:none;white-space:pre}
  .readout2{position:absolute;right:8px;top:6px;font:12px ui-monospace,Menlo,monospace;color:var(--muted);text-align:right;pointer-events:none;white-space:pre}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
  .row label{min-width:84px;color:var(--muted)}
  .row input[type=range]{flex:1;min-width:140px}
  .val{min-width:76px;text-align:right;font:13px ui-monospace,Menlo,monospace}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#20262a;color:var(--text);font-size:14px}
  .btn.primary{border-color:var(--acc);color:#fff;background:#1d3a48}
  .btn.on{border-color:var(--c1);color:var(--c1)}
  select{background:#20262a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px}
  .ch{border-left:3px solid var(--c1);padding-left:10px;margin:10px 0}
  .ch.b{border-color:var(--c2)}
  .ch h3{margin:0 0 4px;font-size:13px}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  .msg{color:#ffb4a8;font-size:13px;margin-top:6px;min-height:1em}
  .hidden{display:none}
  input[type=file]{color:var(--muted);max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <h1>オシロスコープ</h1>
  <div class="tabs">
    <button id="tabIn" class="on">入力（マイク／音声ファイル）</button>
    <button id="tabGen">信号発生器</button>
  </div>

  <div class="screen">
    <canvas id="cv"></canvas>
    <div class="readout" id="ro1"></div>
    <div class="readout2" id="ro2"></div>
  </div>

  <!-- 入力モード -->
  <div id="paneIn">
    <div class="panel">
      <div class="btns">
        <button class="btn primary" id="micBtn">マイク開始</button>
        <button class="btn" id="pauseBtn">一時停止</button>
        <button class="btn on" id="trigBtn">トリガー ON</button>
      </div>
      <div class="row" style="margin-top:12px">
        <label>音声ファイル</label>
        <input type="file" id="fileIn" accept="audio/*,video/*">
        <button class="btn" id="filePlay" disabled>再生</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="row"><label>時間/div</label><input type="range" id="tdivIn" min="0" max="12" value="5"><span class="val" id="tdivInV"></span></div>
      <div class="row"><label>振幅/div</label><input type="range" id="vdivIn" min="0" max="8" value="5"><span class="val" id="vdivInV"></span></div>
      <div class="row"><label>トリガー位置</label><input type="range" id="trigLv" min="-50" max="50" value="0"><span class="val" id="trigLvV"></span></div>
      <div class="note">振幅は入力のフルスケールを ±1.0 とした相対値です。</div>
    </div>
  </div>

  <!-- 発生器モード -->
  <div id="paneGen" class="hidden">
    <div class="panel">
      <div class="row">
        <label>表示</label>
        <select id="dispMode">
          <option value="yt">Y-T（時間波形）</option>
          <option value="xy">X-Y（リサジュー）</option>
        </select>
        <button class="btn" id="animBtn">位相を動かす</button>
        <button class="btn" id="soundBtn">CH1を鳴らす</button>
      </div>

      <div class="ch">
        <h3 style="color:var(--c1)">CH1</h3>
        <div class="row"><label>波形</label>
          <select id="w1"><option value="sine">正弦波</option><option value="square">矩形波</option><option value="triangle">三角波</option><option value="saw">のこぎり波</option></select>
        </div>
        <div class="row"><label>周波数</label><input type="range" id="f1" min="0" max="1000" value="500"><span class="val" id="f1V"></span></div>
        <div class="row"><label>振幅</label><input type="range" id="a1" min="0" max="100" value="80"><span class="val" id="a1V"></span></div>
      </div>

      <div class="ch b">
        <h3 style="color:var(--c2)">CH2 <label style="font-weight:400;color:var(--muted);margin-left:8px"><input type="checkbox" id="en2" checked> 表示</label></h3>
        <div class="row"><label>波形</label>
          <select id="w2"><option value="sine">正弦波</option><option value="square">矩形波</option><option value="triangle">三角波</option><option value="saw">のこぎり波</option></select>
        </div>
        <div class="row"><label>周波数</label><input type="range" id="f2" min="0" max="1000" value="600"><span class="val" id="f2V"></span></div>
        <div class="row"><label>振幅</label><input type="range" id="a2" min="0" max="100" value="80"><span class="val" id="a2V"></span></div>
        <div class="row"><label>位相差</label><input type="range" id="p2" min="0" max="360" value="90"><span class="val" id="p2V"></span></div>
      </div>

      <div class="row"><label>時間/div</label><input type="range" id="tdivGen" min="0" max="12" value="5"><span class="val" id="tdivGenV"></span></div>
      <div class="row"><label>振幅/div</label><input type="range" id="vdivGen" min="0" max="8" value="6"><span class="val" id="vdivGenV"></span></div>
      <div class="note">リサジュー図形は CH1 を横軸、CH2 を縦軸にとります。周波数比を 1:2、2:3 などの整数比にすると図形が止まります。</div>
      <div class="btns" style="margin-top:8px">
        <button class="btn" data-ratio="1:1">1:1</button>
        <button class="btn" data-ratio="1:2">1:2</button>
        <button class="btn" data-ratio="2:3">2:3</button>
        <button class="btn" data-ratio="3:4">3:4</button>
        <button class="btn" data-ratio="3:5">3:5</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const DIVX = 10, DIVY = 8;

  // 1-2-5 系列
  const TDIV = [0.0001,0.0002,0.0005,0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1].slice(0,13); // 秒
  const VDIV = [0.01,0.02,0.05,0.1,0.2,0.25,0.5,1,2];
  const fmtT = s => s >= 1 ? s+' s' : s >= 0.001 ? +(s*1000).toPrecision(3)+' ms' : +(s*1e6).toPrecision(3)+' µs';
  const fmtF = f => (f < 10 ? f.toFixed(2) : f < 100 ? f.toFixed(1) : Math.round(f).toString()) + ' Hz';

  let mode = 'in';

  // ---------- Canvas ----------
  let W = 0, H = 0, dpr = 1;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    W = Math.round(r.width * dpr); H = Math.round(r.width * 0.8 * dpr);
    cv.width = W; cv.height = H;
    if (mode === 'gen') drawGen();
  }
  window.addEventListener('resize', resize);

  function grid(){
    ctx.fillStyle = '#050807'; ctx.fillRect(0,0,W,H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(120,160,140,0.18)';
    ctx.beginPath();
    for (let i=1;i<DIVX;i++){ const x = Math.round(i*W/DIVX)+0.5; ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for (let j=1;j<DIVY;j++){ const y = Math.round(j*H/DIVY)+0.5; ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
    // 中心軸と目盛り
    ctx.strokeStyle = 'rgba(120,160,140,0.4)';
    ctx.beginPath();
    const cx = Math.round(W/2)+0.5, cy = Math.round(H/2)+0.5;
    ctx.moveTo(cx,0); ctx.lineTo(cx,H); ctx.moveTo(0,cy); ctx.lineTo(W,cy);
    const tick = 4*dpr;
    for (let i=0;i<=DIVX*5;i++){ const x = Math.round(i*W/(DIVX*5))+0.5; ctx.moveTo(x,cy-tick); ctx.lineTo(x,cy+tick); }
    for (let j=0;j<=DIVY*5;j++){ const y = Math.round(j*H/(DIVY*5))+0.5; ctx.moveTo(cx-tick,y); ctx.lineTo(cx+tick,y); }
    ctx.stroke();
  }
  function trace(color, pts){
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2*dpr; ctx.lineJoin = 'round';
    ctx.shadowColor = color; ctx.shadowBlur = 6*dpr;
    ctx.beginPath();
    for (let i=0;i<pts.length;i+=2){ i ? ctx.lineTo(pts[i],pts[i+1]) : ctx.moveTo(pts[i],pts[i+1]); }
    ctx.stroke(); ctx.restore();
  }

  // ---------- 入力モード ----------
  let actx = null, analyser = null, buf = null;
  let micStream = null, micSrc = null, fileBuf = null, fileSrc = null, fileGain = null;
  let paused = false, trigOn = true, raf = 0;

  function ensureCtx(){
    if (!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser();
      analyser.fftSize = 32768;
      analyser.smoothingTimeConstant = 0;
      buf = new Float32Array(analyser.fftSize);
    }
    if (actx.state === 'suspended') actx.resume().catch(()=>{});
  }
  const say = t => $('msg').textContent = t || '';

  $('micBtn').onclick = async () => {
    if (micStream){ stopMic(); return; }
    try{
      ensureCtx();
      stopFile();
      micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      micSrc = actx.createMediaStreamSource(micStream);
      micSrc.connect(analyser);
      $('micBtn').textContent = 'マイク停止'; say('');
      startLoop();
    }catch(e){
      micStream = null;
      say('マイクを使えませんでした（この表示環境ではマイクが許可されていない可能性があります）。音声ファイルを選ぶと波形を表示できます。');
    }
  };
  function stopMic(){
    if (micSrc) micSrc.disconnect();
    if (micStream) micStream.getTracks().forEach(t=>t.stop());
    micStream = micSrc = null;
    $('micBtn').textContent = 'マイク開始';
  }

  $('fileIn').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      ensureCtx();
      say('読み込み中…');
      const ab = await f.arrayBuffer();
      fileBuf = await new Promise((res,rej)=>actx.decodeAudioData(ab,res,rej));
      say('「再生」を押すとループ再生しながら波形を表示します。');
      $('filePlay').disabled = false;
    }catch(err){ say('このファイルは読み込めませんでした。'); }
  };
  $('filePlay').onclick = () => {
    if (fileSrc){ stopFile(); return; }
    if (!fileBuf) return;
    ensureCtx(); stopMic();
    fileSrc = actx.createBufferSource(); fileSrc.buffer = fileBuf; fileSrc.loop = true;
    fileGain = actx.createGain(); fileGain.gain.value = 0.8;
    fileSrc.connect(analyser); fileSrc.connect(fileGain); fileGain.connect(actx.destination);
    fileSrc.start();
    $('filePlay').textContent = '停止'; say('');
    startLoop();
  };
  function stopFile(){
    if (fileSrc){ try{fileSrc.stop();}catch(e){} fileSrc.disconnect(); }
    if (fileGain) fileGain.disconnect();
    fileSrc = fileGain = null;
    $('filePlay').textContent = '再生';
  }

  $('pauseBtn').onclick = () => {
    paused = !paused;
    $('pauseBtn').textContent = paused ? '再開' : '一時停止';
    $('pauseBtn').classList.toggle('on', paused);
    if (!paused) startLoop(); else drawIn(true);
  };
  $('trigBtn').onclick = () => {
    trigOn = !trigOn;
    $('trigBtn').textContent = trigOn ? 'トリガー ON' : 'トリガー OFF';
    $('trigBtn').classList.toggle('on', trigOn);
    if (paused) drawIn(true);
  };

  function bindRange(id, fmt, onChange){
    const el = $(id), v = $(id+'V');
    const upd = () => { if (v) v.textContent = fmt(+el.value); onChange && onChange(); };
    el.addEventListener('input', upd); upd();
  }
  bindRange('tdivIn', i => fmtT(TDIV[i]), () => paused && drawIn(true));
  bindRange('vdivIn', i => VDIV[i].toString(), () => paused && drawIn(true));
  bindRange('trigLv', v => (v/100).toFixed(2), () => paused && drawIn(true));

  function startLoop(){
    cancelAnimationFrame(raf);
    const loop = () => { if (mode!=='in' || paused) return; drawIn(false); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
  }

  function measure(d, sr){
    let mn = Infinity, mx = -Infinity;
    for (let i=0;i<d.length;i++){ const s=d[i]; if(s<mn)mn=s; if(s>mx)mx=s; }
    const vpp = mx - mn;
    // 中点基準・ヒステリシス付き立ち上がりで周波数推定
    const mid = (mx+mn)/2, hy = vpp*0.1;
    let armed = false, first = -1, last = -1, n = 0;
    if (vpp > 0.005){
      for (let i=0;i<d.length;i++){
        if (d[i] < mid - hy) armed = true;
        else if (armed && d[i] >= mid){
          // 補間
          const t = i - 1 + (mid - d[i-1])/((d[i]-d[i-1])||1);
          if (first < 0) first = t; else n++;
          last = t; armed = false;
        }
      }
    }
    const freq = n > 0 ? sr * n / (last - first) : 0;
    return {vpp, freq, mn, mx};
  }

  function drawIn(frozen){
    grid();
    const tdiv = TDIV[+$('tdivIn').value], vdiv = VDIV[+$('vdivIn').value];
    $('ro2').textContent = `${fmtT(tdiv)}/div\n${vdiv}/div`;
    if (!analyser){ $('ro1').textContent = 'CH1  入力なし'; return; }
    if (!frozen) analyser.getFloatTimeDomainData(buf);
    const sr = actx.sampleRate, N = buf.length;
    let need = Math.min(N-2, Math.round(tdiv*DIVX*sr));
    // トリガー：最新側から立ち上がり交差を探す
    let start = N - need;
    const lv = +$('trigLv').value/100;
    let trig = false;
    if (trigOn){
      for (let i = N - need - 1; i > 1; i--){
        if (buf[i-1] < lv && buf[i] >= lv){ start = i; trig = true; break; }
        if (N - need - i > sr*0.25) break;
      }
    }
    const pts = [];
    const step = Math.max(1, need / (W*1.5));
    for (let k=0;k<=need;k+=step){
      const i = Math.min(N-1, start + Math.floor(k));
      pts.push(k/need*W, H/2 - buf[i]/vdiv * (H/DIVY));
    }
    trace('#7CFF8A', pts);
    if (trigOn){
      const y = H/2 - lv/vdiv*(H/DIVY);
      ctx.fillStyle = trig ? '#4fc3f7' : '#666';
      ctx.beginPath(); ctx.moveTo(W,y); ctx.lineTo(W-10*dpr,y-6*dpr); ctx.lineTo(W-10*dpr,y+6*dpr); ctx.fill();
    }
    const m = measure(buf, sr);
    $('ro1').textContent = `CH1  f=${m.freq?fmtF(m.freq):'---'}  Vpp=${m.vpp.toFixed(3)}${paused?'  [停止中]':''}${trigOn&&!trig?'  [未トリガ]':''}`;
  }

  // ---------- 発生器モード ----------
  const FMIN = 1, FMAX = 5000;
  const posToF = p => +(FMIN * Math.pow(FMAX/FMIN, p/1000)).toPrecision(3);
  const fToPos = f => Math.round(1000*Math.log(f/FMIN)/Math.log(FMAX/FMIN));
  function wave(type, ph){ // ph: 位相（周期単位）
    const x = ph - Math.floor(ph);
    switch(type){
      case 'square': return x < 0.5 ? 1 : -1;
      case 'triangle': return x < 0.25 ? 4*x : x < 0.75 ? 2 - 4*x : 4*x - 4;
      case 'saw': return x < 0.5 ? 2*x : 2*x - 2;
      default: return Math.sin(2*Math.PI*x);
    }
  }
  let anim = false, animPhase = 0, animRaf = 0, lastT = 0;
  let osc = null, oscGain = null;

  ['f1','f2'].forEach(id => bindRange(id, p => fmtF(posToF(p)), genChanged));
  ['a1','a2'].forEach(id => bindRange(id, v => (v/100).toFixed(2), genChanged));
  bindRange('p2', v => v+'°', genChanged);
  bindRange('tdivGen', i => fmtT(TDIV[i]), genChanged);
  bindRange('vdivGen', i => VDIV[i].toString(), genChanged);
  ['w1','w2','dispMode','en2'].forEach(id => $(id).addEventListener('change', genChanged));

  document.querySelectorAll('[data-ratio]').forEach(b => b.onclick = () => {
    const [a,c] = b.dataset.ratio.split(':').map(Number);
    const base = 200;
    $('f1').value = fToPos(base*a); $('f2').value = fToPos(base*c);
    $('f1').dispatchEvent(new Event('input')); $('f2').dispatchEvent(new Event('input'));
    $('dispMode').value = 'xy'; $('en2').checked = true;
    // XY は1周期が見える時間幅に
    const T = 1/(base) * 1.0; // 基本周期 5ms → 10div で 1周期以上
    let idx = TDIV.findIndex(t => t*DIVX >= T*2); $('tdivGen').value = idx<0?TDIV.length-1:idx;
    $('tdivGen').dispatchEvent(new Event('input'));
    genChanged();
  });

  $('animBtn').onclick = () => {
    anim = !anim;
    $('animBtn').classList.toggle('on', anim);
    $('animBtn').textContent = anim ? '位相を止める' : '位相を動かす';
    if (anim){ lastT = performance.now(); animRaf = requestAnimationFrame(animLoop); }
    else cancelAnimationFrame(animRaf);
  };
  function animLoop(t){
    if (!anim || mode!=='gen') return;
    animPhase += (t - lastT)/1000 * 0.15; lastT = t;
    drawGen(); animRaf = requestAnimationFrame(animLoop);
  }

  $('soundBtn').onclick = () => {
    if (osc){ stopSound(); return; }
    try{
      ensureCtx();
      osc = actx.createOscillator();
      const t = $('w1').value; osc.type = t === 'saw' ? 'sawtooth' : t;
      osc.frequency.value = posToF(+$('f1').value);
      oscGain = actx.createGain(); oscGain.gain.value = 0.15 * (+$('a1').value/100);
      osc.connect(oscGain); oscGain.connect(actx.destination); osc.start();
      $('soundBtn').textContent = '音を止める'; $('soundBtn').classList.add('on');
    }catch(e){ osc = null; }
  };
  function stopSound(){
    if (osc){ try{osc.stop();}catch(e){} osc.disconnect(); oscGain.disconnect(); }
    osc = oscGain = null;
    $('soundBtn').textContent = 'CH1を鳴らす'; $('soundBtn').classList.remove('on');
  }
  function genChanged(){
    if (osc){
      const t = $('w1').value; osc.type = t === 'saw' ? 'sawtooth' : t;
      osc.frequency.setTargetAtTime(posToF(+$('f1').value), actx.currentTime, 0.02);
      oscGain.gain.setTargetAtTime(0.15*(+$('a1').value/100), actx.currentTime, 0.02);
    }
    if (mode === 'gen') drawGen();
  }

  function drawGen(){
    if (!W) return;
    grid();
    const f1 = posToF(+$('f1').value), f2 = posToF(+$('f2').value);
    const a1 = +$('a1').value/100, a2 = +$('a2').value/100;
    const w1 = $('w1').value, w2 = $('w2').value;
    const p2 = +$('p2').value/360 + animPhase;
    const en2 = $('en2').checked;
    const tdiv = TDIV[+$('tdivGen').value], vdiv = VDIV[+$('vdivGen').value];
    const xy = $('dispMode').value === 'xy';
    const span = tdiv*DIVX;
    const ys = H/DIVY/vdiv;

    if (!xy){
      const n = Math.min(20000, Math.max(W*2, Math.ceil(span*Math.max(f1,f2)*80)));
      const p1 = [], q = [];
      for (let k=0;k<=n;k++){
        const t = k/n*span, x = k/n*W;
        p1.push(x, H/2 - a1*wave(w1, f1*t)*ys);
        if (en2) q.push(x, H/2 - a2*wave(w2, f2*t + p2)*ys);
      }
      if (en2) trace('#FFD166', q);
      trace('#7CFF8A', p1);
      $('ro1').textContent = `CH1 ${fmtF(f1)} ${a1.toFixed(2)}` + (en2 ? `\nCH2 ${fmtF(f2)} ${a2.toFixed(2)} Δφ=${Math.round(((p2%1)+1)%1*360)}°` : '');
      $('ro2').textContent = `${fmtT(tdiv)}/div\n${vdiv}/div`;
    } else {
      // 共通周期（整数比近似）を描く
      const g = approxRatio(f1, f2);
      const Tcommon = g ? g.p / f1 : 0.2;
      const T = Math.min(Math.max(Tcommon, 1/Math.min(f1,f2)), 2);
      const n = Math.min(40000, Math.max(2000, Math.ceil(T*Math.max(f1,f2)*200)));
      const ysX = W/DIVX/vdiv;
      const pts = [];
      for (let k=0;k<=n;k++){
        const t = k/n*T;
        pts.push(W/2 + a1*wave(w1, f1*t)*ysX, H/2 - (en2 ? a2*wave(w2, f2*t + p2) : 0)*ys);
      }
      trace('#7CFF8A', pts);
      $('ro1').textContent = `X: CH1 ${fmtF(f1)}\nY: CH2 ${fmtF(f2)}` + (g ? `\n比 ${g.p}:${g.q}` : '\n比 非整数');
      $('ro2').textContent = `X-Y\n${vdiv}/div`;
    }
  }
  function approxRatio(f1, f2){
    // f2/f1 ≒ q2/q1 を分母16以下で探す
    const r = f2/f1;
    for (let d=1; d<=16; d++){
      const nn = Math.round(r*d);
      if (nn>0 && Math.abs(nn/d - r) < 0.01*r){
        const gg = gcd(nn,d); return {p: d/gg, q: nn/gg};
      }
    }
    return null;
  }
  function gcd(a,b){ return b ? gcd(b, a%b) : a; }

  // ---------- タブ ----------
  function setMode(m){
    mode = m;
    $('tabIn').classList.toggle('on', m==='in');
    $('tabGen').classList.toggle('on', m==='gen');
    $('paneIn').classList.toggle('hidden', m!=='in');
    $('paneGen').classList.toggle('hidden', m!=='gen');
    cancelAnimationFrame(raf); cancelAnimationFrame(animRaf);
    if (m==='in'){ stopSound(); paused || !analyser ? drawIn(true) : startLoop(); }
    else { drawGen(); if (anim){ lastT = performance.now(); animRaf = requestAnimationFrame(animLoop); } }
  }
  $('tabIn').onclick = () => setMode('in');
  $('tabGen').onclick = () => setMode('gen');

  resize();
  drawIn(true);
})();
</script>
